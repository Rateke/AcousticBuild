name: Publicar no GitHub Pages

# Cada push na main gera o site de novo. Também dá para rodar à mão pela aba
# Actions ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          # o site fica em https://<usuário>.github.io/<repositório>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # O Pages não conhece as rotas do React: abrir /calculadora direto daria
      # 404. Servir o próprio app como página de erro resolve.
      - name: Rotas do React no Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
